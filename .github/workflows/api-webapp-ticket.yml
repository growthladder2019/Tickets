name: API Web App Ticket

on:
  push:
    branches:
      - main
    paths:
      - "TicketAPI/**"
      - "SQL/**"
      - ".github/workflows/api-webapp-ticket.yml"
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy Ticket API
    env:
      API_APPSETTINGS_PRODUCTION_JSON_SECRET: ${{ secrets.API_APPSETTINGS_PRODUCTION_JSON }}
      AZURE_WEBAPP_PUBLISH_PROFILE_SECRET: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore TicketAPI/TicketAPI/TicketAPI.csproj

      - name: Publish
        run: dotnet publish TicketAPI/TicketAPI/TicketAPI.csproj -c Release -r linux-x64 --self-contained false -o "${{ github.workspace }}/publish"

      - name: Validate production appsettings secret
        run: |
          if [ -z "$API_APPSETTINGS_PRODUCTION_JSON_SECRET" ]; then
            echo "Missing required GitHub secret: API_APPSETTINGS_PRODUCTION_JSON"
            exit 1
          fi

      - name: Validate deployment secrets
        run: |
          if [ -z "$AZURE_WEBAPP_PUBLISH_PROFILE_SECRET" ]; then
            echo "Missing required GitHub secret: AZURE_WEBAPP_PUBLISH_PROFILE"
            exit 1
          fi

      - name: Resolve app identity from publish profile
        id: resolve_app
        run: |
          PROFILE_SITE_NAME=$(printf '%s' "$AZURE_WEBAPP_PUBLISH_PROFILE_SECRET" | sed -n 's/.*msdeploySite="\([^"]*\)".*/\1/p' | head -n 1)
          DESTINATION_URL=$(printf '%s' "$AZURE_WEBAPP_PUBLISH_PROFILE_SECRET" | sed -n 's/.*destinationAppUrl="\([^"]*\)".*/\1/p' | head -n 1)
          PROFILE_HOST_APP_NAME=$(printf '%s' "$DESTINATION_URL" | sed -n 's#https\?://\([^/]*\).*#\1#p' | cut -d'.' -f1)

          if [ -z "$PROFILE_SITE_NAME" ] && [ -z "$PROFILE_HOST_APP_NAME" ]; then
            echo "Could not parse app identity from AZURE_WEBAPP_PUBLISH_PROFILE"
            exit 1
          fi

          APP_NAME="$PROFILE_SITE_NAME"
          if [ -z "$APP_NAME" ]; then
            APP_NAME="$PROFILE_HOST_APP_NAME"
          fi

          echo "Publish profile site name: ${PROFILE_SITE_NAME:-<missing>}"
          echo "Publish profile URL app: ${PROFILE_HOST_APP_NAME:-<missing>}"
          echo "Resolved deploy app-name: $APP_NAME"
          echo "app_name=$APP_NAME" >> "$GITHUB_OUTPUT"

      - name: Write appsettings.Production.json
        run: |
          printf '%s' "$API_APPSETTINGS_PRODUCTION_JSON_SECRET" > "${{ github.workspace }}/publish/appsettings.Production.json"

      - name: Deploy to Azure Web App (publish profile)
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ steps.resolve_app.outputs.app_name }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: "${{ github.workspace }}/publish"
