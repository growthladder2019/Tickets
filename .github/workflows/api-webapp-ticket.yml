name: API Web App Ticket

on:
  push:
    branches:
      - main
    paths:
      - "TicketAPI/**"
      - "SQL/**"
      - ".github/workflows/api-webapp-ticket.yml"
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy Ticket API
    env:
      AZURE_WEBAPP_PUBLISH_PROFILE_SECRET: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
      AZURE_WEBAPP_PUBLISH_PROFILE_ALT_SECRET: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE }}
      AZURE_CREDENTIALS_SECRET: ${{ secrets.AZURE_CREDENTIALS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore TicketAPI/TicketAPI/TicketAPI.csproj

      - name: Publish
        run: dotnet publish TicketAPI/TicketAPI/TicketAPI.csproj -c Release -r linux-x64 --self-contained false -o "${{ github.workspace }}/publish"

      - name: Validate production appsettings secret
        run: |
          if [ -z "${{ secrets.API_APPSETTINGS_PRODUCTION_JSON }}" ]; then
            echo "Missing required GitHub secret: API_APPSETTINGS_PRODUCTION_JSON"
            exit 1
          fi

      - name: Validate deployment secrets
        run: |
          if [ -z "${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}" ] && [ -z "${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE }}" ] && [ -z "${{ secrets.AZURE_CREDENTIALS }}" ]; then
            echo "Missing deployment credentials. Add AZURE_WEBAPP_PUBLISH_PROFILE (or AZUREAPPSERVICE_PUBLISHPROFILE), or AZURE_CREDENTIALS."
            exit 1
          fi

      - name: Resolve Azure Web App name
        id: resolve_app_name
        run: |
          PROFILE_CONTENT="${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}"
          if [ -z "$PROFILE_CONTENT" ]; then
            PROFILE_CONTENT="${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE }}"
          fi

          APP_NAME=""
          if [ -n "$PROFILE_CONTENT" ]; then
            APP_NAME=$(printf '%s' "$PROFILE_CONTENT" | sed -n 's/.*destinationAppUrl="https:\/\/\([^.\"]*\)\.azurewebsites\.net".*/\1/p' | head -n 1)
            if [ -z "$APP_NAME" ]; then
              APP_NAME=$(printf '%s' "$PROFILE_CONTENT" | sed -n 's/.*msdeploySite="\([^"]*\)".*/\1/p' | head -n 1)
            fi
          fi

          if [ -z "$APP_NAME" ]; then
            APP_NAME="${{ secrets.AZURE_WEBAPP_NAME }}"
          fi

          if [ -z "$APP_NAME" ]; then
            APP_NAME="MindTicketManagement"
          fi

          echo "app_name=$APP_NAME" >> "$GITHUB_OUTPUT"

      - name: Write appsettings.Production.json
        run: |
          cat > "${{ github.workspace }}/publish/appsettings.Production.json" <<'EOF'
          ${{ secrets.API_APPSETTINGS_PRODUCTION_JSON }}
          EOF

      - name: Azure Login (service principal)
        if: ${{ env.AZURE_WEBAPP_PUBLISH_PROFILE_SECRET == '' && env.AZURE_WEBAPP_PUBLISH_PROFILE_ALT_SECRET == '' && env.AZURE_CREDENTIALS_SECRET != '' }}
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Web App (publish profile)
        if: ${{ env.AZURE_WEBAPP_PUBLISH_PROFILE_SECRET != '' }}
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ steps.resolve_app_name.outputs.app_name }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: "${{ github.workspace }}/publish"

      - name: Deploy to Azure Web App (alternate publish profile secret)
        if: ${{ env.AZURE_WEBAPP_PUBLISH_PROFILE_SECRET == '' && env.AZURE_WEBAPP_PUBLISH_PROFILE_ALT_SECRET != '' }}
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ steps.resolve_app_name.outputs.app_name }}
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE }}
          package: "${{ github.workspace }}/publish"

      - name: Deploy to Azure Web App (azure login)
        if: ${{ env.AZURE_WEBAPP_PUBLISH_PROFILE_SECRET == '' && env.AZURE_WEBAPP_PUBLISH_PROFILE_ALT_SECRET == '' && env.AZURE_CREDENTIALS_SECRET != '' }}
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ steps.resolve_app_name.outputs.app_name }}
          package: "${{ github.workspace }}/publish"
