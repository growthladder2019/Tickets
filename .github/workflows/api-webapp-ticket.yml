name: API Web App Ticket

on:
  push:
    branches:
      - main
    paths:
      - "TicketAPI/**"
      - "SQL/**"
      - ".github/workflows/api-webapp-ticket.yml"
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy Ticket API
    env:
      API_APP_NAME: mindticketmanagement-fna0gsfmfjecfrbe
      API_APPSETTINGS_PRODUCTION_JSON_SECRET: ${{ secrets.API_APPSETTINGS_PRODUCTION_JSON }}
      AZURE_WEBAPP_PUBLISH_PROFILE_SECRET: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore TicketAPI/TicketAPI/TicketAPI.csproj

      - name: Publish
        run: dotnet publish TicketAPI/TicketAPI/TicketAPI.csproj -c Release -r linux-x64 --self-contained false -o "${{ github.workspace }}/publish"

      - name: Validate production appsettings secret
        run: |
          if [ -z "$API_APPSETTINGS_PRODUCTION_JSON_SECRET" ]; then
            echo "Missing required GitHub secret: API_APPSETTINGS_PRODUCTION_JSON"
            exit 1
          fi

      - name: Validate deployment secrets
        run: |
          if [ -z "$AZURE_WEBAPP_PUBLISH_PROFILE_SECRET" ]; then
            echo "Missing required GitHub secret: AZURE_WEBAPP_PUBLISH_PROFILE"
            exit 1
          fi

      - name: Validate publish profile matches app
        run: |
          PROFILE_APP_NAME=$(printf '%s' "$AZURE_WEBAPP_PUBLISH_PROFILE_SECRET" | sed -n 's/.*destinationAppUrl="https:\/\/\([^.\"]*\)\.azurewebsites\.net".*/\1/p' | head -n 1)
          if [ -z "$PROFILE_APP_NAME" ]; then
            echo "Could not parse app name from AZURE_WEBAPP_PUBLISH_PROFILE"
            exit 1
          fi

          echo "Publish profile app: $PROFILE_APP_NAME"
          if [ "$PROFILE_APP_NAME" != "$API_APP_NAME" ]; then
            echo "Publish profile belongs to '$PROFILE_APP_NAME' but workflow targets '$API_APP_NAME'."
            echo "Update AZURE_WEBAPP_PUBLISH_PROFILE with a profile from the target app."
            exit 1
          fi

      - name: Write appsettings.Production.json
        run: |
          printf '%s' "$API_APPSETTINGS_PRODUCTION_JSON_SECRET" > "${{ github.workspace }}/publish/appsettings.Production.json"

      - name: Deploy to Azure Web App (publish profile)
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.API_APP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: "${{ github.workspace }}/publish"
