name: API Web App Ticket

on:
  push:
    branches:
      - main
    paths:
      - "TicketAPI/**"
      - "SQL/**"
      - ".github/workflows/api-webapp-linux.yml"
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy Ticket API

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore TicketAPI/TicketAPI/TicketAPI.csproj

      - name: Publish
        run: dotnet publish TicketAPI/TicketAPI/TicketAPI.csproj -c Release -r linux-x64 --self-contained false -o "${{ github.workspace }}/publish"

      - name: Validate production appsettings secret
        run: |
          if [ -z "${{ secrets.API_APPSETTINGS_PRODUCTION_JSON }}" ]; then
            echo "Missing required GitHub secret: API_APPSETTINGS_PRODUCTION_JSON"
            exit 1
          fi

      - name: Validate deployment secrets
        run: |
          if [ -z "${{ secrets.AZURE_WEBAPP_NAME }}" ]; then
            echo "Missing required GitHub secret: AZURE_WEBAPP_NAME"
            exit 1
          fi

          if [ -z "${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}" ] && [ -z "${{ secrets.AZURE_CREDENTIALS }}" ]; then
            echo "Missing deployment credentials. Add either AZURE_WEBAPP_PUBLISH_PROFILE or AZURE_CREDENTIALS."
            exit 1
          fi

      - name: Write appsettings.Production.json
        run: |
          cat > "${{ github.workspace }}/publish/appsettings.Production.json" <<'EOF'
          ${{ secrets.API_APPSETTINGS_PRODUCTION_JSON }}
          EOF

      - name: Azure Login (service principal)
        if: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE == '' && secrets.AZURE_CREDENTIALS != '' }}
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Web App (publish profile)
        if: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE != '' }}
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: "${{ github.workspace }}/publish"

      - name: Deploy to Azure Web App (azure login)
        if: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE == '' && secrets.AZURE_CREDENTIALS != '' }}
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          package: "${{ github.workspace }}/publish"
