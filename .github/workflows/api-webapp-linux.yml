name: API Web App Ticket

on:
  push:
    branches:
      - main
    paths:
      - "TicketAPI/**"
      - "SQL/**"
      - ".github/workflows/api-webapp-linux.yml"
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy Ticket API

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore TicketAPI/TicketAPI/TicketAPI.csproj

      - name: Publish
        run: dotnet publish TicketAPI/TicketAPI/TicketAPI.csproj -c Release -r linux-x64 --self-contained false -o "${{ github.workspace }}/publish"

      - name: Validate production appsettings secret
        run: |
          if [ -z "${{ secrets.API_APPSETTINGS_PRODUCTION_JSON }}" ]; then
            echo "Missing required GitHub secret: API_APPSETTINGS_PRODUCTION_JSON"
            exit 1
          fi

      - name: Write appsettings.Production.json
        run: |
          cat > "${{ github.workspace }}/publish/appsettings.Production.json" <<'EOF'
          ${{ secrets.API_APPSETTINGS_PRODUCTION_JSON }}
          EOF

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: "${{ github.workspace }}/publish"
